<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudo Dirigido: do neurônio ao Dying ReLU</title>
<style>
  :root {
    --bg: #0b1120; --painel: #111a2e; --borda: #263250; --texto: #e2e8f0; --suave: #94a3b8;
    --azul: #60a5fa; --rosa: #fb7185; --verde: #34d399; --ambar: #fbbf24; --roxo: #a78bfa; --cinza: #475569;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--texto); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--borda); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 14px; margin: 0 0 8px; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; }
  main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; padding: 10px 16px; }
  /* O diagrama encolhe com a altura da janela para sobrar espaço para os controles abaixo dele. */
  #svg { display: block; margin: 0 auto; max-height: 38vh; }
  #grafico { display: block; margin: 0 auto; max-height: 20vh; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
  section, .cartao { background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; padding: 10px 12px; }
  button { font: inherit; cursor: pointer; color: var(--texto); background: #1e293b; border: 1px solid var(--borda); border-radius: 8px; padding: 6px 12px; }
  button:hover { background: #26354f; }
  button[aria-pressed="true"], button.ativo { background: #2563eb; border-color: #3b82f6; }
  button.destaque { background: #059669; border-color: #10b981; font-weight: 600; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--ambar); outline-offset: 2px; }
  .linha { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grupo-botoes { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  label.campo { display: grid; grid-template-columns: 70px 1fr 56px; gap: 8px; align-items: center; font-size: 13px; color: var(--suave); }
  label.campo output { color: var(--texto); font-variant-numeric: tabular-nums; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--azul); }
  input[type=number] { width: 66px; background: #0b1328; color: var(--texto); border: 1px solid var(--borda); border-radius: 6px; padding: 3px 5px; font: inherit; font-variant-numeric: tabular-nums; }
  #explicacao { min-height: 3.2em; margin: 10px 0 0; }
  #aviso { margin-top: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid #7f1d1d; background: #2a1215; color: #fecaca; display: none; }
  #aviso.ativo { display: block; }
  #aviso.ok { border-color: #14532d; background: #0f2a1d; color: #bbf7d0; }
  svg text { font-family: inherit; }
  .halo { paint-order: stroke; stroke: var(--painel); stroke-width: 4px; stroke-linejoin: round; }
  .no-vivo circle { stroke: var(--verde); fill: #0f2a22; }
  .no-morto circle { stroke: var(--cinza); fill: #1a2233; stroke-dasharray: 4 3; }
  .no-entrada circle { stroke: var(--azul); fill: #0f1d3a; }
  .no-morto .valor { fill: var(--suave); }
  .no-saturado circle { stroke: var(--ambar); fill: #2a2410; stroke-dasharray: 4 3; }
  .cel.fraca { color: var(--ambar); }
  select { font: inherit; color: var(--texto); background: #0b1328; border: 1px solid var(--borda); border-radius: 6px; padding: 4px 8px; }
  select:focus-visible { outline: 3px solid var(--ambar); outline-offset: 2px; }
  label.sel { display: grid; grid-template-columns: 150px 1fr; gap: 8px; align-items: center; font-size: 13px; color: var(--suave); }
  #grade-camadas { display: grid; gap: 12px; margin-top: 10px; }
  .camada { border: 1px solid var(--borda); border-radius: 10px; padding: 10px; }
  .camada h3 { margin: 0 0 6px; font-size: 13px; color: var(--ambar); }
  .grupo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0; padding: 6px 8px; border-radius: 8px; border: 1px dashed transparent; transition: opacity .15s, border-color .15s; }
  .grupo .rotulo { flex-basis: 100%; font-size: 12px; color: var(--suave); }
  .op { color: var(--suave); font-size: 18px; padding: 0 2px; }
  .mat { display: grid; gap: 3px 6px; padding: 4px 8px; border-left: 2px solid var(--suave); border-right: 2px solid var(--suave); border-radius: 6px; align-items: center; justify-items: center; }
  .mat .cel { min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; padding: 2px 4px; border-radius: 4px; }
  .mat .viés, .mat .vies { background: #2b2410; }
  .cel.morta { color: var(--suave); text-decoration: line-through; }
  .cel.zero { color: var(--ambar); }
  [data-foco="1"] .grupo:not([data-g="1"]), [data-foco="2"] .grupo:not([data-g="2"]),
  [data-foco="3"] .grupo:not([data-g="3"]), [data-foco="4"] .grupo:not([data-g="4"]) { opacity: .35; }
  [data-foco="1"] .grupo[data-g="1"], [data-foco="2"] .grupo[data-g="2"],
  [data-foco="3"] .grupo[data-g="3"], [data-foco="4"] .grupo[data-g="4"] { border-color: var(--ambar); }
  #pixels { display: grid; grid-template-columns: repeat(2, 56px); gap: 6px; }
  #pixels button { height: 56px; font-weight: 700; }
  #pixels button.aceso { background: #f8fafc; color: #0f172a; }
  .legenda { font-size: 12px; color: var(--suave); }
  .nota { font-size: 13px; color: var(--suave); }
  code { background: #0b1328; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>Estudo dirigido: do neurônio ao Dying ReLU</h1>
  <div class="grupo-botoes" role="group" aria-label="Escolha o experimento" id="abas"></div>
</header>

<main>
  <div style="display:grid; gap:16px; align-content:start;">
    <section aria-labelledby="t-rede">
      <div class="linha" style="justify-content:space-between;">
        <h2 id="t-rede" style="margin:0;">A rede</h2>
        <label style="display:flex; gap:8px; align-items:center; cursor:pointer;">
          <input type="checkbox" id="tg-dummy" checked>
          <span>Mostrar o dummy <strong>+1</strong> (o viés como entrada fixa)</span>
        </label>
      </div>
      <svg id="svg" viewBox="0 0 680 350" width="100%" role="img" aria-label="Diagrama da rede com os valores atuais"></svg>
      <p class="legenda" id="leg-rede" style="margin:6px 0 0;"></p>
      <div id="aviso" role="status"></div>
    </section>

    <section aria-labelledby="t-ctrl">
      <h2 id="t-ctrl">Experimente</h2>
      <div id="controles" style="display:grid; gap:10px;"></div>
    </section>

    <section aria-labelledby="t-hist">
      <h2 id="t-hist">Perda ao longo dos passos</h2>
      <svg id="grafico" viewBox="0 0 680 150" width="100%" role="img" aria-label="Gráfico da perda por passo de treino"></svg>
      <p class="legenda" id="leg-grafico"></p>
    </section>
  </div>

  <section aria-labelledby="t-mat">
    <h2 id="t-mat">As contas em matrizes (os valores azuis podem ser editados)</h2>
    <div class="linha" role="group" aria-label="Fase do cálculo" id="fases"></div>
    <p id="explicacao" aria-live="polite"></p>
    <div id="perda-faixa" class="cartao" style="margin-top:10px;"></div>
    <div id="grade-camadas"></div>
    <p class="nota" style="margin-top:12px;" id="nota-conv"></p>
  </section>
</main>

<script src="estudo_dirigido_motor.js?v=3"></script>
<script>
"use strict";
// =============================================================================
// PRESETS
// =============================================================================
const IMAGENS = {
  diag:  { nome: "Diagonal", x: [1, 0, 0, 1], y: 1 },
  horiz: { nome: "Horizontal", x: [1, 1, 0, 0], y: 0 },
  preta: { nome: "Preta", x: [0, 0, 0, 0], y: 0 },
  anti:  { nome: "Anti-diagonal", x: [0, 1, 1, 0], y: 0 },
};
const PESOS_DETECTOR = {
  morto:   { nome: "Morto: w = 0,1 e b = −0,5", W: [0.1, 0.1, 0.1, 0.1], b: -0.5 },
  vivo:    { nome: "Vivo: w = 0,1 e b = 0", W: [0.1, 0.1, 0.1, 0.1], b: 0 },
  jupyter: { nome: "Treinado no Jupyter", W: [0.315, -0.320, 0.038, 0.674], b: 0.006 },
};

const MODOS = {
  neuronio: {
    aba: "1. Um neurônio",
    camadas: [2, 1], saida: "relu",
    W: [[[1, 0.5]]], b: [[-1.5]],
    x: [2, 1], y: 2, lr: 0.1,
    nomesEntrada: ["x₁", "x₂"], nomesNeuronios: [["n"]],
    xMax: 20, yMin: 1, yMax: 100, yPasso: 1,
    dica: "Um neurônio. Com ReLU, baixe o viés até z ficar negativo e veja o gradiente sumir de vez. Depois troque a ativação para logística ou tanh e compare: o gradiente fica minúsculo, mas não zero.",
  },
  duas: {
    aba: "2. Duas camadas",
    camadas: [2, 2, 1], saida: "linear",
    W: [[[1, 2], [3, 0]], [[2, 1]]], b: [[0, 0], [0]],
    x: [2, 1], y: 10, lr: 0.01,
    nomesEntrada: ["x₁", "x₂"], nomesNeuronios: [["A", "B"], ["saída"]],
    xMax: 20, yMin: 1, yMax: 100, yPasso: 1,
    dica: "A culpa da saída volta pela transposta de W₂, mas só chega aos neurônios ocultos que estão vivos.",
  },
  detector: {
    aba: "3. Detector 2×2 (Dying ReLU)",
    camadas: [4, 1], saida: "relu",
    W: [[[0.1, 0.1, 0.1, 0.1]]], b: [[-0.5]],
    x: [1, 0, 0, 1], y: 1, lr: 0.1,
    nomesEntrada: ["p₁", "p₂", "p₃", "p₄"], nomesNeuronios: [["detector"]],
    pixels: true, yMax: 1,
    dica: "Treine 20 passos com o neurônio morto e depois com o vivo. Compare o gráfico da perda. Depois troque a ativação para logística ou tanh e repita com os pesos \"Morto\": ele não morre, porque a derivada nunca chega a zero.",
  },
};

// =============================================================================
// ESTADO
// =============================================================================
const E = {
  modo: "neuronio", rede: null, x: [], y: 0, lr: 0.1,
  fase: 0, historico: [], passos: 0, treinarEm: "atual", imagem: "diag", dummy: true, sorteioVivo: false,
  ultimaInfo: "", timer: null,
};
const refs = {};

const fmt = (v, d = 2) => {
  const t = (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d);
  return t.replace("-", "−");
};
// Gradientes e derivadas: "0" só quando é exatamente 0; valores minúsculos aparecem em notação
// científica (assim "quase zero" da tanh/logística não é confundido com o zero exato da ReLU).
const fmtG = (v) => {
  if (v === 0) return "0";
  if (Math.abs(v) < 0.01) return v.toExponential(1).replace(/-/g, "−");
  return fmt(v);
};
const fmtD = (v) => (v === 0 ? "0" : (v === 1 ? "1" : (v < 0.01 ? v.toExponential(1).replace(/-/g, "−") : v.toFixed(3))));

// ---- ativações -----------------------------------------------------------
const OPCOES_OCULTA = [["relu", "ReLU"], ["tanh", "tanh"], ["sigmoid", "logística (sigmoide)"]];
const OPCOES_SAIDA = [["relu", "ReLU"], ["tanh", "tanh"], ["sigmoid", "logística (sigmoide)"], ["linear", "linear (sem ativação)"]];
const nomeAtivDaCamada = (l) => Motor.ATIVACOES[Motor.ativacaoDaCamada(E.rede, l)].nome;
const modoDaCamada = (l) => Motor.ativacaoDaCamada(E.rede, l);
const FORMULA_DERIVADA = {
  relu: "ReLU'(z) = 1 se z > 0, senão 0",
  tanh: "tanh'(z) = 1 − tanh²(z)",
  sigmoid: "σ'(z) = σ(z)·(1 − σ(z))",
  linear: "f'(z) = 1",
};

function el(tag, attrs, ...filhos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null) e.setAttribute(k, v);
  }
  for (const f of filhos) e.append(f);
  return e;
}
const NS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, texto) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (texto !== undefined) e.textContent = texto;
  return e;
}

// =============================================================================
// CARREGAR UM MODO
// =============================================================================
function carregarModo(nome) {
  pararAuto();
  const m = MODOS[nome];
  E.modo = nome;
  E.rede = Motor.criarRede(m.camadas, m.saida, m.W, m.b, m.ativOculta || "relu");
  E.x = m.x.slice();
  E.y = m.y;
  E.lr = m.lr;
  E.fase = 0;
  E.historico = [];
  E.passos = 0;
  E.treinarEm = nome === "detector" ? "todas" : "atual";
  E.imagem = "diag";
  E.ultimaInfo = "";
  construirAbas();
  construirControles();
  construirSvg();
  construirMatrizes();
  construirFases();
  atualizar();
}

function resetar() { carregarModo(E.modo); }

// Troca a função de ativação. Mantém pesos, entradas e alvo; zera o histórico (a perda muda de forma).
function mudarAtivacao({ oculta, saida }) {
  pararAuto();
  if (oculta) E.rede.ativacaoOculta = oculta;
  if (saida) E.rede.ativacaoSaida = saida;
  E.historico = [];
  E.passos = 0;
  E.ultimaInfo = "Função de ativação trocada: o gráfico da perda recomeçou.";
  ajustarParaFaixas();
  aplicarFaixas();
  construirSvg();
  construirMatrizes();
  atualizar();
}

// Sorteia W e b entre −1 e 1 (2 casas). Mantém entradas, alvo e taxa; zera o histórico do treino.
function sortearPesos() {
  pararAuto();
  const sorteio = () => Math.round((Math.random() * 2 - 1) * 100) / 100;
  const sortearTudo = () => {
    E.rede.W.forEach((Wl) => Wl.forEach((linha) => linha.forEach((_, j, arr) => { arr[j] = sorteio(); })));
    E.rede.b.forEach((bl) => bl.forEach((_, i, arr) => { arr[i] = sorteio(); }));
  };
  const todosVivos = () => Motor.avancar(E.rede, E.x).viva.every((camada) => camada.every(Boolean));
  let msg = "Pesos e vieses sorteados entre −1 e 1.";
  if (E.sorteioVivo) {
    let tentativas = 0;
    do { sortearTudo(); tentativas++; } while (!todosVivos() && tentativas < 500);
    msg = todosVivos()
      ? `Pesos sorteados entre −1 e 1, com todos os neurônios vivos para esta entrada (${tentativas} tentativa${tentativas > 1 ? "s" : ""}).`
      : "Pesos sorteados entre −1 e 1, mas não achei um sorteio com todos os neurônios vivos em 500 tentativas.";
  } else {
    sortearTudo();
  }
  E.historico = [];
  E.passos = 0;
  E.ultimaInfo = msg;
  atualizar();
}

// =============================================================================
// ABAS, FASES E CONTROLES
// =============================================================================
function construirAbas() {
  const nav = document.getElementById("abas");
  nav.replaceChildren(...Object.entries(MODOS).map(([k, m]) =>
    el("button", { type: "button", "aria-pressed": String(k === E.modo), onclick: () => carregarModo(k) }, m.aba)));
}

const FASES = [
  "Visão geral", "1. Ida (forward)", "2. Perda", "3. Volta (culpa)", "4. Atualizar",
];
function construirFases() {
  const box = document.getElementById("fases");
  box.replaceChildren(...FASES.map((nome, i) =>
    el("button", { type: "button", "aria-pressed": String(i === E.fase), onclick: () => { E.fase = i; atualizar(); } }, nome)));
}

function campo(rotulo, min, max, passo, valor, aoMudar, casas = 2) {
  const out = el("output", {}, fmt(valor, casas));
  const inp = el("input", { type: "range", min, max, step: passo, value: valor, "aria-label": rotulo });
  inp.addEventListener("input", () => { const v = parseFloat(inp.value); out.textContent = fmt(v, casas); aoMudar(v); atualizar(); });
  const lab = el("label", { class: "campo" }, el("span", {}, rotulo), inp, out);
  lab._sync = (v) => { inp.value = v; out.textContent = fmt(v, casas); };
  // Muda a faixa da barra (usado quando a ativação escolhida pede outra escala).
  lab._faixa = (mn, mx, ps, c) => { inp.min = mn; inp.max = mx; inp.step = ps; casas = c; };
  return lab;
}

// =============================================================================
// FAIXAS DAS BARRAS POR ATIVAÇÃO
// tanh e logística só ficam "vivas" para |z| pequeno (tanh: |z| < 1,8; logística: |z| < 3,6), e a saída
// delas é limitada (tanh: −1 a 1; logística: 0 a 1). ReLU e linear aceitam qualquer escala.
// =============================================================================
const ehSuave = (k) => k === "tanh" || k === "sigmoid";

function faixasPorAtivacao() {
  const m = MODOS[E.modo];
  const ativEntrada = modoDaCamada(0);                       // ativação da 1ª camada, que recebe x
  const ativSaida = modoDaCamada(E.rede.W.length - 1);
  const fx = m.pixels ? null
    : (ehSuave(ativEntrada) ? { min: -3, max: 3, passo: 0.1, casas: 1 } : { min: 0, max: m.xMax, passo: 0.5, casas: 1 });
  let fy;
  if (m.pixels) fy = { min: 0, max: m.yMax, passo: 1, casas: 1 };
  else if (ativSaida === "sigmoid") fy = { min: 0, max: 1, passo: 0.05, casas: 2 };
  else if (ativSaida === "tanh") fy = { min: -1, max: 1, passo: 0.05, casas: 2 };
  else fy = { min: m.yMin !== undefined ? m.yMin : 0, max: m.yMax, passo: m.yPasso !== undefined ? m.yPasso : 0.5, casas: 1 };
  return { fx, fy };
}

const limitar = (v, mn, mx) => Math.min(mx, Math.max(mn, v));

// Puxa as entradas e o alvo atuais para dentro das faixas da ativação escolhida.
function ajustarParaFaixas() {
  const { fx, fy } = faixasPorAtivacao();
  if (fx) E.x = E.x.map((v) => limitar(v, fx.min, fx.max));
  E.y = limitar(E.y, fy.min, fy.max);
}

function aplicarFaixas() {
  const { fx, fy } = faixasPorAtivacao();
  if (fx) refs.camposX.forEach((c) => c._faixa(fx.min, fx.max, fx.passo, fx.casas));
  refs.campoY._faixa(fy.min, fy.max, fy.passo, fy.casas);
}

function construirControles() {
  const m = MODOS[E.modo];
  const box = document.getElementById("controles");
  const itens = [];
  refs.camposX = [];
  refs.pixels = [];

  itens.push(el("p", { class: "nota", style: "margin:0" }, m.dica));

  // ---- escolha da função de ativação ----
  const temOculta = E.rede.camadas.length > 2;
  const seletor = (rotulo, id, opcoes, valor, aoMudar) => {
    const s = el("select", { id, "aria-label": rotulo });
    opcoes.forEach(([v, nome]) => {
      const o = el("option", { value: v }, nome);
      if (v === valor) o.selected = true;
      s.append(o);
    });
    s.addEventListener("change", () => aoMudar(s.value));
    return el("label", { class: "sel" }, el("span", {}, rotulo), s);
  };
  if (temOculta) {
    itens.push(seletor("Ativação das ocultas", "sel-oculta", OPCOES_OCULTA, E.rede.ativacaoOculta,
      (v) => mudarAtivacao({ oculta: v })));
  }
  itens.push(seletor(temOculta ? "Ativação da saída" : "Ativação do neurônio", "sel-saida", OPCOES_SAIDA,
    E.rede.ativacaoSaida, (v) => mudarAtivacao({ saida: v })));
  itens.push(el("p", { class: "nota", id: "dica-ativ", style: "margin:0", "aria-live": "polite" }));

  if (m.pixels) {
    const grade = el("div", { id: "pixels", role: "group", "aria-label": "Pixels da imagem 2×2" });
    for (let j = 0; j < 4; j++) {
      const b = el("button", { type: "button", onclick: () => { E.x[j] = E.x[j] ? 0 : 1; E.imagem = "livre"; atualizar(); } });
      refs.pixels.push(b);
      grade.append(b);
    }
    itens.push(el("div", { class: "linha" }, grade,
      el("div", { class: "grupo-botoes", role: "group", "aria-label": "Imagens prontas" },
        ...Object.entries(IMAGENS).map(([k, im]) =>
          el("button", { type: "button", "data-img": k, onclick: () => { E.imagem = k; E.x = im.x.slice(); E.y = im.y; atualizar(); } }, im.nome)))));
    itens.push(el("div", { class: "grupo-botoes", role: "group", "aria-label": "Pesos iniciais" },
      ...Object.entries(PESOS_DETECTOR).map(([k, p]) =>
        el("button", { type: "button", onclick: () => { E.rede.W[0][0] = p.W.slice(); E.rede.b[0][0] = p.b; E.historico = []; E.passos = 0; E.ultimaInfo = ""; atualizar(); } }, p.nome))));
    itens.push(el("div", { class: "grupo-botoes", role: "group", "aria-label": "O que treinar" },
      el("button", { type: "button", "data-trein": "todas", onclick: () => { E.treinarEm = "todas"; atualizar(); } }, "Treinar nas 4 imagens"),
      el("button", { type: "button", "data-trein": "atual", onclick: () => { E.treinarEm = "atual"; atualizar(); } }, "Treinar só na imagem atual")));
  } else {
    m.nomesEntrada.forEach((nome, j) => {
      const c = campo(nome, 0, m.xMax, 0.5, E.x[j], (v) => { E.x[j] = v; }, 1);
      refs.camposX.push(c);
      itens.push(c);
    });
  }

  const yMin = m.yMin !== undefined ? m.yMin : 0;
  const yPasso = m.yPasso !== undefined ? m.yPasso : (m.pixels ? 1 : 0.5);
  refs.campoY = campo("alvo y", yMin, m.yMax, yPasso, E.y, (v) => { E.y = v; E.imagem = "livre"; }, 1);
  refs.campoLr = campo("η (taxa)", 0.001, m.pixels ? 1 : 0.5, 0.001, E.lr, (v) => { E.lr = v; }, 3);
  itens.push(refs.campoY, refs.campoLr);
  aplicarFaixas();

  refs.btnAuto = el("button", { type: "button", onclick: alternarAuto }, "▶ Auto");
  itens.push(el("div", { class: "linha" },
    el("button", { type: "button", class: "destaque", onclick: () => { passo(1); } }, "Aplicar 1 passo"),
    el("button", { type: "button", onclick: () => passo(20) }, "Treinar 20 passos"),
    refs.btnAuto,
    el("button", { type: "button", onclick: resetar }, "Reiniciar"),
    el("button", { type: "button", id: "btn-sortear", onclick: sortearPesos, title: "Pesos e vieses novos, sorteados entre −1 e 1" }, "🎲 Sortear pesos")));
  const cbVivo = el("input", { type: "checkbox", id: "tg-sorteio-vivo" });
  cbVivo.checked = E.sorteioVivo;
  cbVivo.addEventListener("change", () => { E.sorteioVivo = cbVivo.checked; });
  itens.push(el("label", { class: "nota", style: "display:flex; gap:8px; align-items:center; cursor:pointer; margin:0;" },
    cbVivo, el("span", {}, "O sorteio garante neurônios vivos (tenta até 500 vezes). Desligado, a ReLU nasce morta em cerca de metade dos sorteios.")));
  itens.push(el("p", { class: "nota", id: "info-passo", style: "margin:0", "aria-live": "polite" }));
  box.replaceChildren(...itens);
}

// =============================================================================
// DIAGRAMA SVG
// =============================================================================
function posicoes() {
  const cs = E.rede.camadas;
  const n = cs.length;
  return cs.map((q, l) => Array.from({ length: q }, (_, i) => ({
    x: 70 + l * (540 / (n - 1)),
    y: 205 + (i - (q - 1) / 2) * 76,
  })));
}

const Y_DUMMY = 32;
const COR_VIES = "#fbbf24";

function modosEmUso() {
  return [...new Set(E.rede.W.map((_, l) => modoDaCamada(l)))];
}

function textoLegendaRede() {
  const usaRelu = modosEmUso().includes("relu");
  const usaSuave = modosEmUso().some((k) => k === "tanh" || k === "sigmoid");
  return "Fio azul: peso positivo. Fio rosa: peso negativo. Quanto mais grosso, maior o valor. " +
    (E.dummy ? "Fio âmbar: o viés b, que sai do nó +1 (entrada fixa) de cada camada. " : "") +
    "Neurônio com borda verde está vivo. " +
    (usaRelu ? "Tracejado e cinza: morto (ReLU com z ≤ 0, gradiente exatamente 0). " : "") +
    (usaSuave ? "Tracejado e âmbar: saturado (tanh ou logística com derivada abaixo de 10% do máximo: gradiente minúsculo, mas não zero)." : "");
}

function textoConvencao() {
  const deriv = modosEmUso().map((k) => FORMULA_DERIVADA[k]).join("; ");
  return (E.dummy
    ? "Convenção: a primeira coluna de cada matriz é o viés b, ligado a uma entrada fixa 1 (o \"dummy +1\" da seção 2.1 da metodologia): z = [b | W] · [1 ; a]. "
    : "Convenção: com o dummy oculto, o viés b aparece como um vetor separado: z = W · a + b. ") +
    "Perda: ½ · (a − y)². Derivada usada: " + deriv + ".";
}

function construirSvg() {
  const svg = document.getElementById("svg");
  svg.replaceChildren();
  const P = posicoes();
  const cs = E.rede.camadas;
  const m = MODOS[E.modo];
  refs.arestas = [];
  refs.rotArestas = [];
  refs.nos = [];
  refs.arestasB = [];
  refs.rotB = [];
  document.getElementById("leg-rede").textContent = textoLegendaRede();

  const gArestas = sv("g");
  const gRot = sv("g");
  const gNos = sv("g");
  svg.append(gArestas, gRot, gNos);

  // ---- nós "+1" (um por camada) e fios do viés ----
  if (E.dummy) {
    for (let l = 0; l < E.rede.W.length; l++) {
      refs.arestasB[l] = [];
      refs.rotB[l] = [];
      const ax = P[l][0].x;
      for (let i = 0; i < cs[l + 1]; i++) {
        const b = P[l + 1][i];
        const linha = sv("line", { x1: ax, y1: Y_DUMMY, x2: b.x, y2: b.y, "stroke-linecap": "round" });
        gArestas.append(linha);
        refs.arestasB[l][i] = linha;
        const rot = sv("text", {
          x: ax + (b.x - ax) * 0.62, y: Y_DUMMY + (b.y - Y_DUMMY) * 0.62 - 4,
          "text-anchor": "middle", "font-size": 12, fill: COR_VIES, class: "halo",
        }, "");
        gRot.append(rot);
        refs.rotB[l][i] = rot;
      }
      const g = sv("g", { transform: `translate(${ax},${Y_DUMMY})`, class: "no-dummy" });
      g.append(
        sv("circle", { r: 17, "stroke-width": 2.5, stroke: COR_VIES, fill: "#2b2410" }),
        sv("text", { y: 5, "text-anchor": "middle", "font-size": 13, "font-weight": 700, fill: "#fde68a" }, "+1"),
      );
      gNos.append(g);
    }
  }

  for (let l = 0; l < E.rede.W.length; l++) {
    refs.arestas[l] = [];
    refs.rotArestas[l] = [];
    for (let i = 0; i < cs[l + 1]; i++) {
      refs.arestas[l][i] = [];
      refs.rotArestas[l][i] = [];
      for (let j = 0; j < cs[l]; j++) {
        const a = P[l][j], b = P[l + 1][i];
        const linha = sv("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, "stroke-linecap": "round" });
        gArestas.append(linha);
        refs.arestas[l][i][j] = linha;
        const t = cs[l] === 1 ? 0.5 : 0.33;
        const r = sv("text", { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t - 4, "text-anchor": "middle", "font-size": 12, fill: "#e2e8f0", class: "halo" }, "");
        gRot.append(r);
        refs.rotArestas[l][i][j] = r;
      }
    }
  }

  for (let l = 0; l < cs.length; l++) {
    refs.nos[l] = [];
    for (let i = 0; i < cs[l]; i++) {
      const p = P[l][i];
      const g = sv("g", { transform: `translate(${p.x},${p.y})` });
      const c = sv("circle", { r: 22, "stroke-width": 2.5 });
      const valor = sv("text", { y: 5, "text-anchor": "middle", "font-size": 13, "font-weight": 700, fill: "#e2e8f0", class: "valor" }, "");
      const linha1 = sv("text", { y: 38, "text-anchor": "middle", "font-size": 11.5, fill: "#cbd5e1" }, "");
      const linha2 = sv("text", { y: 51, "text-anchor": "middle", "font-size": 11.5, fill: "#cbd5e1" }, "");
      g.append(c, valor, linha1, linha2);
      // Entradas: o nome fica em cima do círculo. Neurônios: o nome vai na 1ª linha de baixo ("A: z = 4.00"),
      // assim não colide com o neurônio de cima.
      if (l === 0) {
        g.append(sv("text", { y: -29, "text-anchor": "middle", "font-size": 12, fill: "#94a3b8" }, m.nomesEntrada[i]));
      }
      gNos.append(g);
      refs.nos[l][i] = { g, c, valor, linha1, linha2, nome: l === 0 ? "" : m.nomesNeuronios[l - 1][i] };
    }
  }
  const sai = P[cs.length - 1][0];
  refs.alvoTxt = sv("text", { x: sai.x + 36, y: sai.y + 4, "font-size": 13, fill: "#fbbf24", "font-weight": 600 }, "");
  svg.append(refs.alvoTxt);
}

// =============================================================================
// MATRIZES
// =============================================================================
function mat(linhas, colunas, fabrica, extra) {
  const box = el("div", { class: "mat" + (extra ? " " + extra : "") });
  box.style.gridTemplateColumns = `repeat(${colunas}, auto)`;
  const celulas = [];
  for (let i = 0; i < linhas; i++) {
    celulas[i] = [];
    for (let j = 0; j < colunas; j++) {
      const c = fabrica(i, j);
      box.append(c);
      celulas[i][j] = c;
    }
  }
  return { box, celulas };
}
const saida = (classe) => () => el("span", { class: "cel " + (classe || "") }, "");
function entrada(rotulo, aoMudar, classe) {
  return () => {
    const inp = el("input", { type: "number", step: "0.05", "aria-label": rotulo, class: "cel " + (classe || "") });
    inp.addEventListener("input", () => { const v = parseFloat(inp.value); if (!Number.isNaN(v)) { aoMudar(v); atualizar(); } });
    return inp;
  };
}
const op = (t) => el("span", { class: "op", "aria-hidden": "true" }, t);

function construirMatrizes() {
  const grade = document.getElementById("grade-camadas");
  grade.replaceChildren();
  grade.parentElement.dataset.foco = "0";
  const cs = E.rede.camadas;
  const m = MODOS[E.modo];
  refs.M = [];
  const editarX = !m.pixels;

  for (let l = 0; l < E.rede.W.length; l++) {
    const nOut = cs[l + 1], nIn = cs[l];
    const R = (refs.M[l] = {});
    const nomes = m.nomesNeuronios[l];
    const rotuloCamada = l === E.rede.W.length - 1 ? `Camada ${l + 1} (saída)` : `Camada ${l + 1} (oculta)`;
    const camada = el("div", { class: "camada" }, el("h3", {}, rotuloCamada));

    const celulaW = (i, j) => entrada(`peso da camada ${l + 1}, ${nomes[i]}, entrada ${j + 1}`, (v) => { E.rede.W[l][i][j] = v; })();
    const celulaB = (i) => entrada(`viés b da camada ${l + 1}, ${nomes[i]}`, (v) => { E.rede.b[l][i] = v; }, "vies")();
    const celulaA = (j) => (l === 0 && editarX
      ? entrada(`entrada ${j + 1}`, (v) => { E.x[j] = v; })()
      : el("span", { class: "cel" }, ""));
    const vazia = (ehVies) => () => el("span", { class: "cel" + (ehVies ? " vies" : "") }, "");
    const nomeAtiv = nomeAtivDaCamada(l);
    const textoCulpa = l === E.rede.W.length - 1 ? "culpa recebida = a − y" : "culpa recebida = W_seguinteᵀ · δ_seguinte";

    // ---- Grupo 1: ida --------------------------------------------------------
    const zM = mat(nOut, 1, saida());
    const aM = mat(nOut, 1, saida());
    R.z = zM.celulas.map((f) => f[0]);
    R.a = aM.celulas.map((f) => f[0]);
    let g1;
    if (E.dummy) {
      // Coordenadas homogêneas: o viés é a coluna 0 de [b | W], multiplicada pela entrada fixa 1.
      const bW = mat(nOut, nIn + 1, (i, j) => (j === 0 ? celulaB(i) : celulaW(i, j - 1)));
      const vEnt = mat(nIn + 1, 1, (i) => (i === 0 ? el("span", { class: "cel vies" }, "1") : celulaA(i - 1)));
      R.b = bW.celulas.map((f) => f[0]);
      R.W = bW.celulas.map((f) => f.slice(1));
      R.aprev = vEnt.celulas.slice(1).map((f) => f[0]);
      g1 = el("div", { class: "grupo", "data-g": "1" },
        el("div", { class: "rotulo" }, "Ida: z = [b | W] · [1 ; a_anterior]  e  a = " + nomeAtiv + "(z)"),
        bW.box, op("·"), vEnt.box, op("="), zM.box, op("→"), aM.box);
    } else {
      const Wm = mat(nOut, nIn, celulaW);
      const bV = mat(nOut, 1, (i) => celulaB(i));
      const vEnt = mat(nIn, 1, (j) => celulaA(j));
      R.b = bV.celulas.map((f) => f[0]);
      R.W = Wm.celulas;
      R.aprev = vEnt.celulas.map((f) => f[0]);
      g1 = el("div", { class: "grupo", "data-g": "1" },
        el("div", { class: "rotulo" }, "Ida: z = W · a_anterior + b  e  a = " + nomeAtiv + "(z)"),
        Wm.box, op("·"), vEnt.box, op("+"), bV.box, op("="), zM.box, op("→"), aM.box);
    }
    camada.append(g1);

    // ---- Grupo 3: volta ------------------------------------------------------
    const culpaM = mat(nOut, 1, saida());
    const rdM = mat(nOut, 1, saida());
    const dM = mat(nOut, 1, saida());
    R.culpa = culpaM.celulas.map((f) => f[0]);
    R.rd = rdM.celulas.map((f) => f[0]);
    R.d = dM.celulas.map((f) => f[0]);
    let g3;
    if (E.dummy) {
      const gBW = mat(nOut, nIn + 1, (i, j) => vazia(j === 0)());
      R.gb = gBW.celulas.map((f) => f[0]);
      R.gW = gBW.celulas.map((f) => f.slice(1));
      g3 = el("div", { class: "grupo", "data-g": "3" },
        el("div", { class: "rotulo" }, "Volta: δ = (culpa recebida) ⊙ f'(z)  e  ∇[b | W] = δ · [1 ; a_anterior]ᵀ"),
        el("div", { class: "rotulo" }, textoCulpa),
        culpaM.box, op("⊙"), rdM.box, op("="), dM.box, op("→"), gBW.box);
    } else {
      const gWm = mat(nOut, nIn, vazia(false));
      const gbV = mat(nOut, 1, vazia(true));
      R.gb = gbV.celulas.map((f) => f[0]);
      R.gW = gWm.celulas;
      g3 = el("div", { class: "grupo", "data-g": "3" },
        el("div", { class: "rotulo" }, "Volta: δ = (culpa recebida) ⊙ f'(z),  ∇W = δ · a_anteriorᵀ  e  ∇b = δ"),
        el("div", { class: "rotulo" }, textoCulpa),
        culpaM.box, op("⊙"), rdM.box, op("="), dM.box, op("→"), gWm.box, op(","), gbV.box);
    }
    camada.append(g3);

    // ---- Grupo 4: atualização ------------------------------------------------
    let g4;
    if (E.dummy) {
      const nova = mat(nOut, nIn + 1, (i, j) => vazia(j === 0)());
      R.nb = nova.celulas.map((f) => f[0]);
      R.nW = nova.celulas.map((f) => f.slice(1));
      g4 = el("div", { class: "grupo", "data-g": "4" },
        el("div", { class: "rotulo" }, "Atualização: [b | W]novo = [b | W] − η · ∇[b | W]"),
        nova.box);
    } else {
      const nW = mat(nOut, nIn, vazia(false));
      const nb = mat(nOut, 1, vazia(true));
      R.nb = nb.celulas.map((f) => f[0]);
      R.nW = nW.celulas;
      g4 = el("div", { class: "grupo", "data-g": "4" },
        el("div", { class: "rotulo" }, "Atualização: Wnovo = W − η · ∇W  e  bnovo = b − η · ∇b"),
        nW.box, op(","), nb.box);
    }
    camada.append(g4);
    grade.append(camada);
  }
  document.getElementById("nota-conv").textContent = textoConvencao();
}

// =============================================================================
// ATUALIZAR TUDO (sem recriar os controles, para o arrasto e a digitação não se perderem)
// =============================================================================
function setNum(inp, v) {
  if (document.activeElement === inp) return;
  inp.value = Number.isFinite(v) ? String(+v.toFixed(4)) : "";
}

function atualizar() {
  const rede = E.rede;
  const cs = rede.camadas;
  const L = rede.W.length;
  const r = Motor.retropropagar(rede, E.x, [E.y]);
  const f = r.frente;
  const m = MODOS[E.modo];

  document.getElementById("grade-camadas").parentElement.dataset.foco = String(E.fase);
  document.querySelectorAll("#fases button").forEach((b, i) => b.setAttribute("aria-pressed", String(i === E.fase)));
  document.querySelectorAll("#abas button").forEach((b, i) => b.setAttribute("aria-pressed", String(Object.keys(MODOS)[i] === E.modo)));

  // ---- controles ----
  refs.camposX.forEach((c, j) => c._sync(E.x[j]));
  refs.campoY._sync(E.y);
  refs.campoLr._sync(E.lr);
  refs.pixels.forEach((b, j) => {
    b.textContent = `${m.nomesEntrada[j]} = ${E.x[j]}`;
    b.classList.toggle("aceso", !!E.x[j]);
    b.setAttribute("aria-pressed", String(!!E.x[j]));
  });
  document.querySelectorAll("[data-img]").forEach((b) => b.classList.toggle("ativo", b.dataset.img === E.imagem));
  document.querySelectorAll("[data-trein]").forEach((b) => b.classList.toggle("ativo", b.dataset.trein === E.treinarEm));
  document.getElementById("info-passo").textContent =
    `Passos aplicados: ${E.passos}. ${E.ultimaInfo}`;

  // ---- diagrama ----
  const eNovo = (l, i, j) => (j === null ? rede.b[l][i] - E.lr * r.gb[l][i] : rede.W[l][i][j] - E.lr * r.gW[l][i][j]);
  for (let l = 0; l < L; l++) {
    for (let i = 0; i < cs[l + 1]; i++) {
      const morta = !f.viva[l][i];
      const ehRelu = modoDaCamada(l) === "relu";
      // ReLU morta: gradiente exatamente 0 (fio cinza). tanh/logística saturada: fio âmbar, valor minúsculo mas real.
      const corBloq = ehRelu ? "#475569" : "#a16207";
      for (let j = 0; j < cs[l]; j++) {
        const w = rede.W[l][i][j];
        const linha = refs.arestas[l][i][j];
        const bloqueada = E.fase >= 3 && morta;
        linha.setAttribute("stroke", bloqueada ? corBloq : (w > 0 ? "#60a5fa" : (w < 0 ? "#fb7185" : "#64748b")));
        linha.setAttribute("stroke-width", (1.5 + Math.min(7, Math.abs(w) * 2.5)).toFixed(2));
        linha.setAttribute("stroke-dasharray", bloqueada ? "5 5" : "none");
        linha.setAttribute("opacity", E.fase >= 3 && morta ? 0.7 : 1);
        const rot = refs.rotArestas[l][i][j];
        if (E.fase === 3) rot.textContent = bloqueada && ehRelu ? "∇ 0 (×0)" : `∇ ${fmtG(r.gW[l][i][j])}`;
        else if (E.fase === 4) rot.textContent = `${fmt(w)} → ${fmt(eNovo(l, i, j))}`;
        else rot.textContent = fmt(w);
      }
      // fio do viés: sai do nó +1 da camada (só quando o dummy está visível)
      if (E.dummy) {
        const b = rede.b[l][i];
        const linhaB = refs.arestasB[l][i];
        const bloqueadaB = E.fase >= 3 && morta;
        linhaB.setAttribute("stroke", bloqueadaB ? corBloq : (b > 0 ? COR_VIES : (b < 0 ? "#fb7185" : "#64748b")));
        linhaB.setAttribute("stroke-width", (1.5 + Math.min(7, Math.abs(b) * 2.5)).toFixed(2));
        linhaB.setAttribute("stroke-dasharray", bloqueadaB ? "5 5" : "none");
        linhaB.setAttribute("opacity", bloqueadaB ? 0.7 : 1);
        const rotB = refs.rotB[l][i];
        if (E.fase === 3) rotB.textContent = bloqueadaB && ehRelu ? "∇b 0 (×0)" : `∇b ${fmtG(r.gb[l][i])}`;
        else if (E.fase === 4) rotB.textContent = `b ${fmt(b)} → ${fmt(eNovo(l, i, null))}`;
        else rotB.textContent = `b ${fmt(b)}`;
      }
    }
  }
  for (let l = 0; l < cs.length; l++) {
    for (let i = 0; i < cs[l]; i++) {
      const n = refs.nos[l][i];
      if (l === 0) {
        n.g.setAttribute("class", "no-entrada");
        n.valor.textContent = fmt(E.x[i], m.pixels ? 0 : 1);
        n.linha1.textContent = "";
        n.linha2.textContent = "";
        continue;
      }
      const k = l - 1;
      const viva = f.viva[k][i];
      const ehReluN = modoDaCamada(k) === "relu";
      n.g.setAttribute("class", viva ? "no-vivo" : (ehReluN ? "no-morto" : "no-saturado"));
      n.valor.textContent = fmt(f.a[l][i]);
      n.linha1.textContent = `${n.nome}: z = ${fmt(f.z[k][i])}` + (viva ? "" : (ehReluN ? " (≤ 0)" : " (saturado)"));
      if (E.fase === 3) n.linha2.textContent = `δ = ${fmtG(r.delta[k][i])}`;
      else if (E.dummy) n.linha2.textContent = "";
      else n.linha2.textContent = E.fase === 4 ? `b: ${fmt(rede.b[k][i])} → ${fmt(eNovo(k, i, null))}` : `b = ${fmt(rede.b[k][i])}`;
    }
  }
  refs.alvoTxt.textContent = `alvo y = ${fmt(E.y, 1)}`;

  // ---- matrizes ----
  for (let l = 0; l < L; l++) {
    const R = refs.M[l];
    for (let i = 0; i < cs[l + 1]; i++) {
      const viva = f.viva[l][i];
      setNum(R.b[i], rede.b[l][i]);
      for (let j = 0; j < cs[l]; j++) setNum(R.W[i][j], rede.W[l][i][j]);
      R.z[i].textContent = fmt(f.z[l][i]);
      R.z[i].classList.toggle("morta", !viva && modoDaCamada(l) === "relu");
      R.z[i].classList.toggle("fraca", !viva && modoDaCamada(l) !== "relu");
      R.a[i].textContent = fmt(f.a[l + 1][i]);
      const culpa = l === L - 1
        ? f.a[l + 1][i] - E.y
        : rede.W[l + 1].reduce((s, linha, k) => s + linha[i] * r.delta[l + 1][k], 0);
      R.culpa[i].textContent = fmt(culpa);
      const dz = f.deriv[l][i];                 // f'(z): 0 ou 1 na ReLU; entre 0 e o máximo nas outras
      R.rd[i].textContent = fmtD(dz);
      R.rd[i].classList.toggle("zero", dz === 0);
      R.rd[i].classList.toggle("fraca", !viva && dz !== 0);
      R.d[i].textContent = fmtG(r.delta[l][i]);
      R.d[i].classList.toggle("zero", r.delta[l][i] === 0);
      R.gb[i].textContent = fmtG(r.gb[l][i]);
      R.gb[i].classList.toggle("zero", r.gb[l][i] === 0);
      R.nb[i].textContent = fmt(eNovo(l, i, null));
      for (let j = 0; j < cs[l]; j++) {
        R.gW[i][j].textContent = fmtG(r.gW[l][i][j]);
        R.gW[i][j].classList.toggle("zero", r.gW[l][i][j] === 0);
        R.nW[i][j].textContent = fmt(eNovo(l, i, j));
      }
    }
    // vetor de entrada da camada: a_anterior
    for (let j = 0; j < cs[l]; j++) {
      const cel = R.aprev[j];
      if (cel.tagName === "INPUT") setNum(cel, E.x[j]);
      else cel.textContent = fmt(f.a[l][j]);
    }
  }

  // ---- faixa da perda ----
  const saidaA = f.saida[0];
  const erro = saidaA - E.y;
  document.getElementById("perda-faixa").innerHTML =
    `<strong>Perda</strong> = ½ · (a − y)² = ½ · (${fmt(saidaA)} − ${fmt(E.y, 1)})² = <strong>${fmt(r.perda, 3)}</strong>` +
    `&nbsp;&nbsp;<span class="nota">(erro a − y = ${fmt(erro)})</span>`;
  const faixa = document.getElementById("perda-faixa");
  faixa.dataset.g = "2";
  faixa.style.opacity = E.fase === 0 || E.fase === 2 ? 1 : 0.45;
  faixa.style.borderColor = E.fase === 2 ? "#fbbf24" : "";

  // ---- aviso do Dying ReLU ----
  const mortos = [], saturados = [];
  for (let l = 0; l < L; l++) for (let i = 0; i < cs[l + 1]; i++) {
    if (f.viva[l][i]) continue;
    const item = { l, i, z: f.z[l][i], dz: f.deriv[l][i] };
    (modoDaCamada(l) === "relu" ? mortos : saturados).push(item);
  }
  const aviso = document.getElementById("aviso");
  const partes = [];
  if (mortos.length) {
    const lista = mortos.map(({ l, i, z }) => `${m.nomesNeuronios[l][i]} (z = ${fmt(z)})`).join(", ");
    partes.push(`Neurônio morto nesta imagem: ${lista}. Como z ≤ 0, ReLU'(z) = 0 e o gradiente que chega aos pesos dele é exatamente 0. O erro existe (${fmt(r.perda, 3)}), mas esses pesos ficam parados.`);
  }
  if (saturados.length) {
    const lista = saturados.map(({ l, i, z, dz }) => `${m.nomesNeuronios[l][i]} (z = ${fmt(z)}, ${nomeAtivDaCamada(l)}' = ${fmtD(dz)})`).join(", ");
    partes.push(`Neurônio saturado: ${lista}. A curva fica quase plana longe de z = 0, então a derivada é minúscula. O gradiente não é zero, mas quase: o neurônio ainda aprende, só que bem devagar.`);
  }
  if (partes.length) {
    aviso.className = "ativo";
    aviso.textContent = partes.join(" ");
  } else {
    aviso.className = "ativo ok";
    aviso.textContent = "Todos os neurônios estão vivos: a culpa chega a todos os pesos.";
  }

  // ---- dica sobre a faixa da saída ----
  const modoSaida = modoDaCamada(L - 1);
  const faixa2 = { sigmoid: [0, 1, "0 e 1"], tanh: [-1, 1, "−1 e 1"], relu: [0, Infinity, "0 e +∞"], linear: [-Infinity, Infinity, "−∞ e +∞"] }[modoSaida];
  let dica = `Saída ${Motor.ATIVACOES[modoSaida].nome}: valores entre ${faixa2[2]}.`;
  if (E.y < faixa2[0] || E.y > faixa2[1]) {
    dica += ` O alvo y = ${fmt(E.y, 1)} está fora dessa faixa: a perda nunca chega a zero, e o neurônio empurra a saída para o limite.`;
  }
  if (!m.pixels && ehSuave(modoDaCamada(0))) {
    dica += ` As entradas ficam entre −3 e 3: a ${nomeAtivDaCamada(0)} só tem derivada útil para |z| pequeno, e fora disso satura. É o mesmo motivo de normalizar o MNIST (média 0, desvio 1).`;
  }
  document.getElementById("dica-ativ").textContent = dica;

  // ---- explicação da fase ----
  document.getElementById("explicacao").textContent = textoFase(r);

  desenharGrafico();
}

function textoFase(r) {
  const L = E.rede.W.length;
  const f = r.frente;
  const z = f.z[L - 1][0], a = f.saida[0];
  const viva = f.viva[L - 1][0];
  const dz = f.deriv[L - 1][0];
  const nomeSaida = nomeAtivDaCamada(L - 1);
  const modoSaida = modoDaCamada(L - 1);
  switch (E.fase) {
    case 1: return `Ida: cada neurônio soma os pesos vezes as entradas mais o viés e aplica a ${nomeAtivDaCamada(0)}. Na saída, z = ${fmt(z)} e a = ${fmt(a)}.`;
    case 2: return `Perda: a saída ${fmt(a)} é comparada com o alvo ${fmt(E.y, 1)}. O erro é ${fmt(a - E.y)} e a perda é ½ · erro² = ${fmt(r.perda, 3)}.`;
    case 3: {
      if (L > 1) {
        return `Volta: o erro vira δ e volta pelos fios. Em cada camada oculta, δ = (W_seguinteᵀ · δ_seguinte) ⊙ f'(z), com f' da ${nomeAtivDaCamada(0)}. ` +
          (modoDaCamada(0) === "relu" ? "Neurônio com z ≤ 0 recebe δ = 0." : "Neurônio saturado recebe δ minúsculo, mas não zero.");
      }
      const conta = `Volta: δ_saída = (a − y) · f'(z) = ${fmt(a - E.y)} · ${fmtD(dz)} = ${fmtG(r.delta[0][0])}.`;
      if (modoSaida === "relu") return `${conta} ${viva ? "Os pesos recebem gradiente." : "A porta da ReLU está fechada: nenhum gradiente passa."}`;
      if (modoSaida === "linear") return `${conta} Sem ativação, f' = 1: o erro passa inteiro.`;
      return `${conta} ${viva ? "Os pesos recebem gradiente." : `A ${nomeSaida} está saturada: o gradiente é pequeno, mas não zero.`}`;
    }
    case 4: return `Atualização: peso novo = peso − η · gradiente, com η = ${fmt(E.lr, 3)}. Clique em "Aplicar 1 passo" para gravar esses valores.`;
    default: return "Mude qualquer valor azul, as barras ou os pixels e veja tudo recalcular. Use as fases para olhar uma etapa de cada vez.";
  }
}

// =============================================================================
// TREINO
// =============================================================================
function amostrasDeTreino() {
  if (E.modo === "detector" && E.treinarEm === "todas") {
    return Object.values(IMAGENS).map((im) => ({ x: im.x.slice(), y: [im.y] }));
  }
  return [{ x: E.x.slice(), y: [E.y] }];
}

function passo(n) {
  let mudou = false;
  for (let k = 0; k < n; k++) {
    const info = Motor.aplicarPasso(E.rede, amostrasDeTreino(), E.lr);
    E.historico.push(info.perda);
    E.passos++;
    if (info.mudou) mudou = true;
  }
  E.ultimaInfo = mudou
    ? ""
    : "Nenhum peso mudou: todos os gradientes foram 0 (neurônio morto).";
  atualizar();
}

function alternarAuto() {
  if (E.timer) { pararAuto(); return; }
  refs.btnAuto.textContent = "⏸ Pausar";
  E.timer = setInterval(() => { passo(1); if (E.passos >= 400) pararAuto(); }, 120);
}
function pararAuto() {
  if (E.timer) clearInterval(E.timer);
  E.timer = null;
  if (refs.btnAuto) refs.btnAuto.textContent = "▶ Auto";
}

// =============================================================================
// GRÁFICO DA PERDA
// =============================================================================
function desenharGrafico() {
  const svg = document.getElementById("grafico");
  svg.replaceChildren();
  const h = E.historico.slice(-400);
  const leg = document.getElementById("leg-grafico");
  if (h.length === 0) {
    svg.append(sv("text", { x: 340, y: 80, "text-anchor": "middle", fill: "#94a3b8", "font-size": 14 }, "Aplique passos para ver a perda mudar."));
    leg.textContent = "";
    return;
  }
  const W = 680, H = 150, pad = 34;
  const max = Math.max(...h, 1e-9);
  const px = (i) => pad + (h.length === 1 ? 0 : (i / (h.length - 1)) * (W - 2 * pad));
  const py = (v) => H - pad / 2 - (v / max) * (H - pad - 8);
  svg.append(sv("line", { x1: pad, y1: H - pad / 2, x2: W - pad, y2: H - pad / 2, stroke: "#475569" }));
  svg.append(sv("line", { x1: pad, y1: 8, x2: pad, y2: H - pad / 2, stroke: "#475569" }));
  svg.append(sv("text", { x: 4, y: 16, fill: "#94a3b8", "font-size": 11 }, fmt(max, 3)));
  svg.append(sv("text", { x: 4, y: H - 12, fill: "#94a3b8", "font-size": 11 }, "0"));
  const pontos = h.map((v, i) => `${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
  svg.append(sv("polyline", { points: pontos, fill: "none", stroke: "#fbbf24", "stroke-width": 2.5 }));
  const ult = h[h.length - 1];
  svg.append(sv("circle", { cx: px(h.length - 1), cy: py(ult), r: 4, fill: "#fbbf24" }));
  const parado = h.length > 5 && h.slice(-5).every((v) => v === h[h.length - 1]);
  leg.textContent = `Perda no último passo: ${fmt(ult, 4)} (${h.length} passos no gráfico).` +
    (parado ? " A curva está reta: nada está sendo aprendido." : "");
}

document.getElementById("tg-dummy").addEventListener("change", (ev) => {
  E.dummy = ev.target.checked;
  construirSvg();
  construirMatrizes();
  atualizar();
});

carregarModo("neuronio");
</script>
